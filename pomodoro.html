
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄钟</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #f5576c, #ff6b6b);
    padding: 20px;
  }
  .container {
    background: rgba(255,255,255,0.95);
    border-radius: 24px;
    padding: 40px;
    width: 100%;
    max-width: 460px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  }
  h1 {
    text-align: center;
    color: #333;
    font-size: 28px;
    margin-bottom: 8px;
  }
  .subtitle {
    text-align: center;
    color: #999;
    font-size: 14px;
    margin-bottom: 30px;
  }
  .mode-tabs {
    display: flex;
    background: #f0f0f0;
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 30px;
  }
  .mode-tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    border: none;
    background: transparent;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    color: #888;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mode-tab.active {
    background: #fff;
    color: #f5576c;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .timer-display {
    text-align: center;
    margin: 20px 0;
  }
  .timer-circle {
    position: relative;
    width: 260px;
    height: 260px;
    margin: 0 auto;
  }
  .timer-circle svg {
    transform: rotate(-90deg);
    width: 260px;
    height: 260px;
  }
  .timer-circle .bg {
    fill: none;
    stroke: #f0f0f0;
    stroke-width: 6;
  }
  .timer-circle .progress {
    fill: none;
    stroke: #f5576c;
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 753.98;
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 0.5s ease;
  }
  .timer-circle .progress.rest {
    stroke: #4ecdc4;
  }
  .time-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  .time-text .minutes {
    font-size: 64px;
    font-weight: 700;
    color: #333;
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
  }
  .time-text .seconds {
    font-size: 64px;
    font-weight: 700;
    color: #333;
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
  }
  .time-text .separator {
    font-size: 64px;
    font-weight: 700;
    color: #333;
  }
  .time-text .paused-label {
    font-size: 14px;
    color: #f5576c;
    font-weight: 600;
    margin-top: 4px;
  }
  .controls {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 24px;
  }
  .btn {
    padding: 14px 36px;
    border: none;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:active { transform: scale(0.95); }
  .btn-primary {
    background: #f5576c;
    color: #fff;
    min-width: 140px;
  }
  .btn-primary:hover { background: #e04a5e; }
  .btn-secondary {
    background: #f0f0f0;
    color: #666;
  }
  .btn-secondary:hover { background: #e0e0e0; }
  .btn-secondary:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .settings {
    margin-top: 30px;
    padding-top: 24px;
    border-top: 1px solid #f0f0f0;
  }
  .settings-row {
    display: flex;
    justify-content: center;
    gap: 20px;
  }
  .setting-item {
    text-align: center;
  }
  .setting-item label {
    display: block;
    font-size: 13px;
    color: #999;
    margin-bottom: 6px;
  }
  .setting-item input {
    width: 70px;
    padding: 8px 10px;
    border: 2px solid #e8e8e8;
    border-radius: 10px;
    text-align: center;
    font-size: 16px;
    font-weight: 600;
    color: #333;
    outline: none;
    transition: border-color 0.2s;
  }
  .setting-item input:focus { border-color: #f5576c; }
  .setting-item input:disabled {
    background: #f5f5f5;
    color: #bbb;
  }
  .stats {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid #f0f0f0;
  }
  .stat-item {
    text-align: center;
  }
  .stat-item .num {
    font-size: 28px;
    font-weight: 700;
    color: #333;
  }
  .stat-item .label {
    font-size: 13px;
    color: #999;
    margin-top: 2px;
  }
  .notification {
    text-align: center;
    margin-top: 16px;
    font-size: 14px;
    color: #f5576c;
    min-height: 20px;
    font-weight: 500;
  }
  @media (max-width: 480px) {
    .container { padding: 24px; }
    .timer-circle, .timer-circle svg { width: 200px; height: 200px; }
    .time-text .minutes,
    .time-text .seconds,
    .time-text .separator { font-size: 48px; }
    .btn { padding: 12px 28px; font-size: 14px; }
    .btn-primary { min-width: 110px; }
  }
</style>
</head>
<body>

<div class="container">
  <h1>🍅 番茄钟</h1>
  <p class="subtitle">Focus on what matters</p>

  <div class="mode-tabs" id="modeTabs">
    <button class="mode-tab active" data-mode="focus">专注</button>
    <button class="mode-tab" data-mode="shortBreak">短休息</button>
    <button class="mode-tab" data-mode="longBreak">长休息</button>
  </div>

  <div class="timer-display">
    <div class="timer-circle">
      <svg viewBox="0 0 260 260">
        <circle class="bg" cx="130" cy="130" r="120"/>
        <circle class="progress" id="progressRing" cx="130" cy="130" r="120"/>
      </svg>
      <div class="time-text">
        <span class="minutes" id="minutes">25</span><span class="separator">:</span><span class="seconds" id="seconds">00</span>
        <div class="paused-label" id="pausedLabel" style="display:none">已暂停</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="mainBtn">开始</button>
    <button class="btn btn-secondary" id="resetBtn" disabled>重置</button>
  </div>

  <div class="settings">
    <div class="settings-row">
      <div class="setting-item">
        <label>专注 (分)</label>
        <input type="number" id="focusTime" value="25" min="1" max="120">
      </div>
      <div class="setting-item">
        <label>短休 (分)</label>
        <input type="number" id="shortBreakTime" value="5" min="1" max="60">
      </div>
      <div class="setting-item">
        <label>长休 (分)</label>
        <input type="number" id="longBreakTime" value="15" min="1" max="60">
      </div>
    </div>
  </div>

  <div class="stats">
    <div class="stat-item">
      <div class="num" id="completedCount">0</div>
      <div class="label">已完成</div>
    </div>
    <div class="stat-item">
      <div class="num" id="currentStreak">0</div>
      <div class="label">连续</div>
    </div>
  </div>

  <div class="notification" id="notification"></div>
</div>

<script>
  const CIRCUMFERENCE = 2 * Math.PI * 120;
  const progressRing = document.getElementById('progressRing');
  progressRing.style.strokeDasharray = CIRCUMFERENCE;

  const modeTimes = { focus: 25, shortBreak: 5, longBreak: 15 };
  let currentMode = 'focus';
  let totalSeconds = 25 * 60;
  let remaining = totalSeconds;
  let isRunning = false;
  let isPaused = false;
  let timer = null;
  let completedCount = parseInt(localStorage.getItem('pomodoro_count') || '0');
  let currentStreak = parseInt(localStorage.getItem('pomodoro_streak') || '0');

  const $ = id => document.getElementById(id);
  const minsEl = $('minutes');
  const secsEl = $('seconds');
  const mainBtn = $('mainBtn');
  const resetBtn = $('resetBtn');
  const notification = $('notification');
  const pausedLabel = $('pausedLabel');

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return { m: String(m).padStart(2, '0'), s: String(sec).padStart(2, '0') };
  }

  function updateDisplay() {
    const { m, s } = formatTime(remaining);
    minsEl.textContent = m;
    secsEl.textContent = s;
    document.title = `(${m}:${s}) 番茄钟`;
  }

  function updateProgress() {
    const offset = CIRCUMFERENCE * (1 - remaining / totalSeconds);
    progressRing.style.strokeDashoffset = offset;
  }

  function updateProgressColor() {
    progressRing.classList.toggle('rest', currentMode !== 'focus');
  }

  function loadSettings() {
    $('focusTime').value = modeTimes.focus;
    $('shortBreakTime').value = modeTimes.shortBreak;
    $('longBreakTime').value = modeTimes.longBreak;
  }

  function resetTimer() {
    stopTimer();
    isPaused = false;
    pausedLabel.style.display = 'none';
    const t = modeTimes[currentMode];
    totalSeconds = t * 60;
    remaining = totalSeconds;
    updateDisplay();
    updateProgress();
    mainBtn.textContent = '开始';
    mainBtn.disabled = false;
    resetBtn.disabled = true;
    $('focusTime').disabled = false;
    $('shortBreakTime').disabled = false;
    $('longBreakTime').disabled = false;
  }

  function switchMode(mode) {
    if (isRunning && !confirm('当前计时正在进行，是否切换？')) return;
    currentMode = mode;
    document.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
    updateProgressColor();
    resetTimer();
    notification.textContent = '';
  }

  function stopTimer() {
    if (timer) { clearInterval(timer); timer = null; }
    isRunning = false;
  }

  function tick() {
    if (remaining <= 0) {
      stopTimer();
      isPaused = false;
      pausedLabel.style.display = 'none';
      playNotification();

      if (currentMode === 'focus') {
        completedCount++;
        currentStreak++;
        localStorage.setItem('pomodoro_count', completedCount);
        localStorage.setItem('pomodoro_streak', currentStreak);
        $('completedCount').textContent = completedCount;
        $('currentStreak').textContent = currentStreak;
        notification.textContent = '✅ 专注完成！休息一下吧 ~';
      } else {
        notification.textContent = '⏰ 休息结束，开始新的专注！';
      }

      mainBtn.textContent = '完成';
      mainBtn.disabled = true;
      resetBtn.disabled = false;
      return;
    }

    remaining--;
    updateDisplay();
    updateProgress();
  }

  function playNotification() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [523.25, 659.25, 783.99].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.15);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.15 + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + i * 0.15);
        osc.stop(ctx.currentTime + i * 0.15 + 0.3);
      });
    } catch (e) { /* fallback: no sound */ }
  }

  function toggleTimer() {
    if (!isRunning) {
      if (remaining <= 0) return;
      isRunning = true;
      isPaused = false;
      pausedLabel.style.display = 'none';
      mainBtn.textContent = '暂停';
      resetBtn.disabled = false;
      $('focusTime').disabled = true;
      $('shortBreakTime').disabled = true;
      $('longBreakTime').disabled = true;
      timer = setInterval(tick, 1000);
    } else {
      stopTimer();
      isPaused = true;
      pausedLabel.style.display = 'block';
      mainBtn.textContent = '继续';
    }
  }

  // Event listeners
  document.querySelectorAll('.mode-tab').forEach(tab => {
    tab.addEventListener('click', () => switchMode(tab.dataset.mode));
  });

  mainBtn.addEventListener('click', toggleTimer);

  resetBtn.addEventListener('click', resetTimer);

  [$('focusTime'), $('shortBreakTime'), $('longBreakTime')].forEach(el => {
    el.addEventListener('change', () => {
      const v = Math.max(1, parseInt(el.value) || 1);
      el.value = v;
      if (el.id === 'focusTime') modeTimes.focus = v;
      else if (el.id === 'shortBreakTime') modeTimes.shortBreak = v;
      else if (el.id === 'longBreakTime') modeTimes.longBreak = v;
      if (!isRunning) resetTimer();
    });
  });

  // Keyboard shortcut
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); toggleTimer(); }
    if (e.code === 'KeyR' && !isRunning) resetTimer();
  });

  // Init
  progressRing.style.strokeDashoffset = 0;
  loadSettings();
  updateDisplay();
  $('completedCount').textContent = completedCount;
  $('currentStreak').textContent = currentStreak;
</script>
</body>
</html>
